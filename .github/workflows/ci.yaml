name: Symfony CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: '!ChangeMe!'
          POSTGRES_USER: app
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, dom, libxml, xml, xmlwriter, pdo, sqlite3
          tools: composer:v2
          coverage: pcov
      
      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src tests --level=5

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Setup test database
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=16&charset=utf8
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:schema:create
          php bin/console doctrine:fixtures:load --no-interaction

      - name: Run test suite with coverage
        env:
          APP_ENV: test
          APP_DEBUG: '0'
        run: php bin/phpunit --coverage-clover clover.xml --coverage-text

      # - name: Enforce 90% code coverage
      #   run: |
      #     php -r '
      #       $xml = simplexml_load_file("clover.xml");
      #       $metrics = $xml->project->metrics;
      #       $coverage = ($metrics["coveredstatements"] / $metrics["statements"]) * 100;
      #       if ($coverage < 90) {
      #         exit(1);
      #       }
      #     '